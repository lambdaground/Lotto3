name: Lotto Auto Update

on:
  schedule:
    # 🕒 한국 시간 매주 토요일 밤 10:30 실행 (추첨 직후)
    # UTC 13:30 = KST 22:30
    - cron: '30 13 * * 6'
  workflow_dispatch: # ✨ 수동 실행 버튼 (지금 바로 클릭 가능)

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        # lock 파일 불일치 에러를 피하기 위해 임시로 npm install 사용
        run: npm install

      - name: 로또 크롤러 실행
        run: npm run crawler

      - name: 변경된 데이터 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f server/data/lotto-history.json ]; then
            git add server/data/lotto-history.json
            if git diff --staged --quiet; then
              echo "업데이트할 데이터가 없습니다."
            else
              git commit -m "chore: 최신 로또 데이터 강제 업데이트 [skip ci]"
              git push
            fi
          fi
