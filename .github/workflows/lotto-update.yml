name: Lotto Auto Update

on:
  schedule:
    # 매주 일요일 오전 9:30 (KST) 실행
    - cron: '30 0 * * 0'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    # 깃허브 액션이 저장소에 쓰기 권한을 가질 수 있도록 설정
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # npm 캐시를 사용해 속도 향상

      - name: 의존성 설치
        run: npm ci

      - name: 로또 크롤러 실행
        run: npm run crawler

      - name: 변경된 데이터 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 데이터 파일이 있는지 확인하고 추가
          if [ -f server/data/lotto-history.json ]; then
            git add server/data/lotto-history.json
            
            # 변경사항이 있을 때만 커밋 (없으면 스킵하여 에러 방지)
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "chore: update lotto history data [skip ci]"
              git push
            fi
          else
            echo "Error: lotto-history.json not found"
            exit 1
          fi
