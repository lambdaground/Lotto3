name: Lotto Auto Update

on:
  schedule:
    - cron: '30 13 * * 6' # 한국 시간 토요일 밤 10:30
  workflow_dispatch: # 수동 실행

jobs:
  update-lotto:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        # package-lock.json 불일치 에러 방지를 위해 npm install 사용
        run: npm install

      - name: 로또 크롤러 실행
        run: npm run crawler

      - name: 변경된 데이터 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f server/data/lotto-history.json ]; then
            git add server/data/lotto-history.json
            
            # 변경사항이 있을 때만 커밋 (없으면 성공으로 간주하고 종료)
            if git diff --staged --quiet; then
              echo "Nothing to update."
            else
              git commit -m "chore: auto-update lotto data [skip ci]"
              git push
            fi
          fi
