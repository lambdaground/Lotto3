name: 로또 데이터 동기화 (매주 토요일)

on:
  schedule:
    # 🕒 시간 설정 (UTC 기준)
    # UTC 13:00 = 한국 시간 밤 10시 (22:00)
    # 0 13 * * 6 -> 매주 토요일 13:00 UTC 실행
    - cron: '0 13 * * 6'
  workflow_dispatch: # 👆 깃허브 홈페이지에서 수동으로 버튼 눌러서 실행 가능

jobs:
  lotto-cron:
    runs-on: ubuntu-latest
    steps:
      - name: 로또 크론 API 호출
        run: |
          # 로또 전용 주소(/api/cron/lotto)로 요청을 보냅니다.
          curl -s "https://lotto.lambdaground.com/api/cron/lotto?key=${{ secrets.CRON_SECRET }}"
